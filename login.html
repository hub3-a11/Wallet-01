<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0b0e11; color: white; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow-x: hidden; }
        .box { background: #181a20; padding: 30px; border-radius: 12px; width: 100%; max-width: 350px; border: 1px solid #2b3139; margin: 20px; }
        h2 { text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #2b3139; background: #1e2329; color: white; box-sizing: border-box; font-size: 16px; outline: none; transition: 0.2s; }
        input:focus { border-color: #5b41ff; }
        button { width: 100%; padding: 15px; background: #5b41ff; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        
        .message-box { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; font-weight: 500; display: none; opacity: 0; transform: translateY(-10px); transition: all 0.3s ease; }
        .message-box.show { display: block; opacity: 1; transform: translateY(0); }
        .message-box.error { background: rgba(246, 70, 93, 0.1); color: #f6465d; border: 1px solid #f6465d; }
        .message-box.success { background: rgba(14, 203, 129, 0.1); color: #0ecb81; border: 1px solid #0ecb81; }

        .link { text-align: center; font-size: 14px; color: #848e9c; margin-top: 15px; }
        .link a { color: #5b41ff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="loginUser()" id="login-btn">Login</button>
    <div id="login-message" class="message-box"></div>
    <div class="link">Don't have an account? <a href="signup.html">Sign up</a></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAMucqvSoBlUo5jn5Pu4ClQIGRlInu55mQ", authDomain: "project-app-259f2.firebaseapp.com",
      projectId: "project-app-259f2", storageBucket: "project-app-259f2.firebasestorage.app",
      messagingSenderId: "389607996830", appId: "1:389607996830:web:a9e456c60e4608f1a9ea8f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    function showMessage(text, type) {
        const msgBox = document.getElementById('login-message');
        msgBox.innerText = text;
        msgBox.className = `message-box show ${type}`;
    }

    onAuthStateChanged(auth, (user) => { if (user) window.location.href = "dashboard.html"; });

    window.loginUser = async function() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('login-btn');
        const msgBox = document.getElementById('login-message');

        msgBox.className = 'message-box';
        if(!email || !password) return showMessage("Please fill in all fields.", "error");

        btn.innerText = "Logging in...";
        btn.disabled = true;

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists() && userDoc.data().status === 'frozen') {
                await signOut(auth);
                showMessage("Account frozen. Contact support.", "error");
                btn.innerText = "Login"; btn.disabled = false;
                return;
            }

            showMessage("Login Successful! Redirecting...", "success");
            setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);

        } catch (error) {
            if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                showMessage("Incorrect password.", "error");
            } else if (error.code === 'auth/user-not-found') {
                showMessage("Unknown user email.", "error");
            } else {
                showMessage(error.message, "error");
            }
            btn.innerText = "Login"; btn.disabled = false;
        }
    }
</script>
</body>
</html>
