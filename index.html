<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg: #0b0e11; 
            --text: #ffffff; 
            --muted: #848e9c; 
            --green: #5eea8e; 
            --blue: #2c5aff;
            --card: #181a20;
        }
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden;
            padding: 20px;
        }

        /* Entrance Animations */
        .fade-in { 
            animation: fadeIn 1s ease-out forwards; 
            opacity: 0; 
            transform: translateY(20px);
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }

        /* Logo Container */
        .logo-container {
            position: relative;
            margin-bottom: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Subtle Glow behind the logo */
        .logo-glow {
            position: absolute;
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--green), var(--blue));
            filter: blur(60px);
            opacity: 0.4;
            z-index: 0;
            border-radius: 50%;
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.3); opacity: 0.6; }
        }

        /* SVG Shield */
        .shield-svg {
            width: 140px;
            height: 140px;
            z-index: 1;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        /* Buttons Container */
        .buttons-container {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        /* Button Styles */
        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: transform 0.2s, opacity 0.2s;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* Primary Button (Sign Up) */
        .btn-primary {
            background: linear-gradient(135deg, var(--green), var(--blue));
            color: #0b0e11; /* Dark text for contrast */
            box-shadow: 0 8px 24px rgba(44, 90, 255, 0.3);
        }

        /* Secondary Button (Login) */
        .btn-secondary {
            background-color: var(--card);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background-color: #1e2329;
        }

    </style>
</head>
<body>

    <!-- Logo Section -->
    <div class="logo-container fade-in">
        <div class="logo-glow"></div>
        <!-- Custom Shield SVG matching the screenshot -->
        <svg class="shield-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="blueGreenGradient" x1="50" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#2c5aff"/>
                    <stop offset="1" stop-color="#5eea8e"/>
                </linearGradient>
            </defs>
            
            <!-- Left Side (Solid Green) -->
            <path d="M50 8 L10 22 V50 C10 75 50 92 50 92 V8 Z" fill="#5eea8e"/>
            
            <!-- Right Side (Blue-Green Gradient) -->
            <path d="M50 8 L90 22 V50 C90 75 50 92 50 92 V8 Z" fill="url(#blueGreenGradient)"/>
            
            <!-- Center Line Shadow for Depth -->
            <line x1="50" y1="8" x2="50" y2="92" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
        </svg>
    </div>

    <!-- Buttons Section -->
    <div class="buttons-container fade-in delay-1">
        <a href="signup.html" class="btn btn-primary">Create an Account</a>
        <a href="login.html" class="btn btn-secondary">Log In</a>
    </div>

</body>
</html>
