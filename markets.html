<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Markets</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0b0e11; --card: #181a20; --text: #ffffff; --muted: #848e9c; --green: #0ecb81; --red: #f6465d; --purple: #5b41ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 100px; min-height: 100vh; }
        
        .loader-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .loader { width: 40px; height: 40px; border: 4px solid #2b3139; border-top: 4px solid var(--purple); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .header { text-align: center; padding: 20px; font-weight: bold; font-size: 18px; }
        .tabs { display: flex; justify-content: space-around; border-bottom: 1px solid #2b3139; margin-bottom: 20px; }
        .tab { padding: 10px 20px; color: var(--muted); cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; transition: 0.3s; }
        .tab.active { color: var(--text); border-bottom: 2px solid var(--purple); }
        
        .section-title { padding: 0 20px; font-size: 16px; font-weight: 600; margin-bottom: 15px; }
        .bluechips { display: flex; gap: 15px; padding: 0 20px; overflow-x: auto; margin-bottom: 25px; scrollbar-width: none; }
        .bluechip-card { background: var(--card); padding: 15px; border-radius: 12px; min-width: 140px; }
        .bc-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .bc-icon { width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; color: white;}
        .bc-name { font-weight: bold; font-size: 14px; }
        .bc-price { font-size: 14px; font-weight: bold; }
        .bc-change { font-size: 12px; }
        
        .coin-list { padding: 0 20px; }
        .coin-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #1e2329; cursor: pointer; }
        .coin-info { display: flex; align-items: center; gap: 12px; }
        .coin-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; font-weight: bold; color: white; }
        .coin-details h4 { font-size: 15px; }
        .coin-details p { font-size: 12px; color: var(--muted); }
        .coin-price { text-align: right; }
        .coin-price h4 { font-size: 15px; }
        .coin-price p { font-size: 13px; }
        
        .share-btn { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; margin-left: 10px; padding: 5px; }

        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 450px; background: rgba(30, 35, 41, 0.95); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; justify-content: space-around; align-items: center; padding: 10px 0; z-index: 999;}
        .nav-bg { position: absolute; top: 8px; left: 0; width: 55px; height: 45px; background: #2b3139; border-radius: 25px; transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55); z-index: 0; }
        .nav-item { color: var(--muted); font-size: 22px; cursor: pointer; text-decoration: none; display: flex; justify-content: center; align-items: center; width: 64px; height: 45px; z-index: 1; transition: color 0.3s;}
        .nav-item.active { color: white; }
        .nav-item:active { transform: scale(0.9); }
    </style>
</head>
<body>

<div class="loader-overlay" id="loader"><div class="loader"></div></div>

<div class="fade-in">
    <div class="header">Markets</div>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('crypto')">Crypto</div>
        <div class="tab" onclick="switchTab('stocks')">Stocks</div>
    </div>

    <div id="crypto-section">
        <div class="section-title">Bluechips</div>
        <div class="bluechips" id="bluechips-crypto"></div>
        <div class="section-title">Trending Crypto</div>
        <div class="coin-list" id="list-crypto"></div>
    </div>

    <div id="stocks-section" style="display: none;">
        <div class="section-title">Top Stocks</div>
        <div class="coin-list" id="list-stocks"></div>
    </div>
</div>

<!-- UPDATED BOTTOM NAV WITH SWAP -->
<div class="bottom-nav">
    <div class="nav-bg" id="nav-bg"></div>
    <a href="#" class="nav-item" onclick="navigate(event, 'index.html')"><i class="fa-solid fa-house"></i></a>
    <a href="#" class="nav-item active" onclick="navigate(event, 'markets.html')"><i class="fa-solid fa-arrow-trend-up"></i></a>
    <!-- Changed Infinity to Rotate (Swap) -->
    <a href="#" class="nav-item" onclick="navigate(event, 'swap.html')"><i class="fa-solid fa-rotate"></i></a>
    <a href="#" class="nav-item" onclick="alert('Search coming soon!')"><i class="fa-solid fa-magnifying-glass"></i></a>
</div>

<script>
    function setPillPosition(activeItem) {
        const navBg = document.getElementById('nav-bg');
        const translateX = activeItem.offsetLeft + (activeItem.offsetWidth / 2) - (navBg.offsetWidth / 2);
        navBg.style.transform = `translateX(${translateX}px)`;
    }

    window.addEventListener('load', () => {
        document.getElementById('loader').style.opacity = '0';
        setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
        
        setTimeout(() => {
            const activeItem = document.querySelector('.nav-item.active');
            if (activeItem) setPillPosition(activeItem);
        }, 100);
    });

    window.navigate = function(event, url) {
        event.preventDefault();
        const activeItem = event.currentTarget;
        setPillPosition(activeItem);
        
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        activeItem.classList.add('active');
        setTimeout(() => window.location.href = url, 300);
    }

    const getCoinStyle = (symbol) => {
        const styles = {
            'BTC': { bg: '#f7931a', letter: 'B' },
            'SOL': { bg: '#14f195', letter: 'S' },
            'USDT': { bg: '#26a17b', letter: 'T' },
            'BNB': { bg: '#f3ba2f', letter: 'B' },
            'XRP': { bg: '#23292f', letter: 'X' },
            'ADA': { bg: '#0033ad', letter: 'A' },
            'DOGE': { bg: '#c2a633', letter: 'D' }
        };
        return styles[symbol] || { bg: '#2b3139', letter: symbol.charAt(0) };
    };

    const cryptoData = [
        { symbol: 'BTC', name: 'Bitcoin', price: 79446.85, change: -1.09 },
        { symbol: 'SOL', name: 'Solana', price: 145.20, change: 4.50 },
        { symbol: 'USDT', name: 'Tether', price: 1.00, change: 0.01 },
        { symbol: 'BNB', name: 'BNB', price: 580.10, change: 1.20 },
        { symbol: 'XRP', name: 'Ripple', price: 0.52, change: 0.85 },
        { symbol: 'ADA', name: 'Cardano', price: 0.45, change: -2.10 },
        { symbol: 'DOGE', name: 'Dogecoin', price: 0.12, change: 5.40 }
    ];

    const stocksData = [
        { symbol: 'AAPL', name: 'Apple Inc.', price: 175.50, change: 1.2, color: '#555555' },
        { symbol: 'TSLA', name: 'Tesla Inc.', price: 220.30, change: -2.5, color: '#e82127' },
        { symbol: 'NVDA', name: 'Nvidia Corp.', price: 850.10, change: 4.8, color: '#76b900' }
    ];

    function renderList(data, containerId, isStock = false) {
        const container = document.getElementById(containerId);
        container.innerHTML = data.map(coin => {
            const isUp = coin.change >= 0;
            const colorClass = isUp ? 'color: var(--green);' : 'color: var(--red);';
            const sign = isUp ? '+' : '';
            const style = isStock ? { bg: coin.color, letter: coin.symbol.charAt(0) } : getCoinStyle(coin.symbol);
            
            return `
                <div class="coin-item" onclick="window.location.href='chart.html?symbol=${coin.symbol}&price=${coin.price}'">
                    <div class="coin-info">
                        <div class="coin-icon" style="background: ${style.bg};">${style.letter}</div>
                        <div class="coin-details">
                            <h4>${coin.symbol}</h4>
                            <p>$${(coin.price * 1000000).toLocaleString()} MCap</p>
                        </div>
                    </div>
                    <div class="coin-price">
                        <h4>$${coin.price.toLocaleString(undefined, {minimumFractionDigits: 2})}</h4>
                        <p style="${colorClass}">${sign}${coin.change}%</p>
                    </div>
                    <button class="share-btn" onclick="shareAsset(event, '${coin.symbol}')"><i class="fa-solid fa-share-nodes"></i></button>
                </div>
            `;
        }).join('');
    }

    function renderBluechips(data) {
        const container = document.getElementById('bluechips-crypto');
        container.innerHTML = data.slice(0, 4).map(coin => {
            const style = getCoinStyle(coin.symbol);
            return `
                <div class="bluechip-card" onclick="window.location.href='chart.html?symbol=${coin.symbol}&price=${coin.price}'">
                    <div class="bc-header">
                        <div class="bc-icon" style="background: ${style.bg};">${style.letter}</div>
                        <div class="bc-name">${coin.symbol}</div>
                    </div>
                    <div class="bc-price">$${coin.price.toLocaleString(undefined, {minimumFractionDigits: 2})}</div>
                    <div class="bc-change" style="color: ${coin.change >= 0 ? 'var(--green)' : 'var(--red)'}">${coin.change >= 0 ? '+' : ''}${coin.change}%</div>
                </div>
            `;
        }).join('');
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        if(tab === 'crypto') {
            document.getElementById('crypto-section').style.display = 'block';
            document.getElementById('stocks-section').style.display = 'none';
        } else {
            document.getElementById('crypto-section').style.display = 'none';
            document.getElementById('stocks-section').style.display = 'block';
        }
    }

    window.shareAsset = function(event, symbol) {
        event.stopPropagation();
        if (navigator.share) {
            navigator.share({ title: 'Trade ' + symbol, text: 'Check out ' + symbol + '!', url: window.location.origin + '/chart.html?symbol=' + symbol }).catch(console.error);
        } else {
            alert("Link copied to clipboard!");
            navigator.clipboard.writeText(window.location.origin + '/chart.html?symbol=' + symbol);
        }
    }

    renderBluechips(cryptoData);
    renderList(cryptoData, 'list-crypto', false);
    renderList(stocksData, 'list-stocks', true);
</script>
<!-- GLOBAL TRADE RESOLVER -->
<script type="module" src="trade-resolver.js"></script>
</body>
</html>
