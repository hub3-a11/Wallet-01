<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg: #0b0e11; 
            --sidebar: #121418;
            --card: #181a20; 
            --text: #ffffff; 
            --muted: #848e9c; 
            --green: #0ecb81; 
            --purple: #5b41ff; 
            --red: #f6465d; 
            --yellow: #f3ba2f;
            --border: #2b3139;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--card); color: white; padding: 15px 30px; border-radius: 30px; font-weight: bold; font-size: 14px; z-index: 10000; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55); box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; border: 1px solid var(--border);}
        .toast.show { top: 20px; }
        .toast.error { border-color: rgba(246, 70, 93, 0.5); color: var(--red); }
        .toast.success { border-color: rgba(14, 203, 129, 0.5); color: var(--green); }

        /* Sidebar */
        .sidebar { width: 250px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; }
        .brand { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 10px; margin-bottom: 40px; color: var(--purple); }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 15px; border-radius: 10px; color: var(--muted); cursor: pointer; transition: 0.2s; margin-bottom: 5px; font-weight: 500; }
        .nav-item:hover, .nav-item.active { background: rgba(91, 65, 255, 0.1); color: var(--purple); }
        
        /* Main Content */
        .main-content { flex: 1; margin-left: 250px; padding: 30px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .top-bar h1 { font-size: 24px; }
        .admin-profile { display: flex; align-items: center; gap: 10px; background: var(--card); padding: 8px 15px; border-radius: 20px; border: 1px solid var(--border); font-size: 14px; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--border); display: flex; align-items: center; gap: 15px; }
        .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 24px; }
        .stat-info h3 { font-size: 24px; }
        .stat-info p { color: var(--muted); font-size: 13px; }

        /* Dashboard Grid */
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; align-items: start; }
        
        /* Cards */
        .card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card-header h3 { font-size: 18px; display: flex; align-items: center; gap: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
        input, select { width: 100%; padding: 14px; background: var(--bg); border: 1px solid var(--border); color: white; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
        input:focus, select:focus { border-color: var(--purple); }
        
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 14px; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--purple); color: white; width: 100%; }
        .btn-success { background: var(--green); color: black; }
        .btn-danger { background: var(--red); color: white; }

        /* Table */
        .table-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 700px; }
        th, td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
        
        /* Status Badges */
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .badge.active { background: rgba(14, 203, 129, 0.1); color: var(--green); border: 1px solid var(--green); }
        .badge.frozen { background: rgba(243, 186, 47, 0.1); color: var(--yellow); border: 1px solid var(--yellow); }
        .badge.blocked { background: rgba(246, 70, 93, 0.1); color: var(--red); border: 1px solid var(--red); }

        /* Action Dropdown */
        .action-select { padding: 8px; border-radius: 6px; font-size: 12px; background: var(--bg); border: 1px solid var(--border); color: white; cursor: pointer; }

        .code-display { background: rgba(91, 65, 255, 0.1); border: 1px dashed var(--purple); padding: 15px; border-radius: 8px; text-align: center; font-family: monospace; font-size: 20px; font-weight: bold; color: var(--green); margin-top: 15px; display: none; }
        .code-display.show { display: block; animation: fadeIn 0.3s ease; }

        /* Login */
        .login-wrapper { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .login-box { background: var(--card); padding: 40px; border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; }
        .login-box input { margin-bottom: 15px; }
        
        @media (max-width: 900px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 15px; }
            .stats-grid { grid-template-columns: 1fr; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div id="toast" class="toast"><i class="fa-solid fa-circle-check"></i> <span id="toast-msg">Notification</span></div>

<!-- LOGIN SECTION -->
<div id="login-section" class="login-wrapper">
    <div class="login-box">
        <h2><i class="fa-solid fa-shield-halved" style="color: var(--purple);"></i> Admin Login</h2>
        <input type="email" id="admin-email" placeholder="Admin Email">
        <input type="password" id="admin-password" placeholder="Password">
        <button class="btn btn-primary" onclick="loginAdmin()">Secure Login</button>
    </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="admin-section" style="display: none; width: 100%;">
    
    <!-- Sidebar -->
    <div class="sidebar fade-in">
        <div class="brand"><i class="fa-solid fa-cube"></i> Admin Panel</div>
        <div class="nav-item active"><i class="fa-solid fa-chart-pie"></i> Overview</div>
        <div class="nav-item" onclick="logout()" style="margin-top: auto; color: var(--red);"><i class="fa-solid fa-right-from-bracket"></i> Logout</div>
    </div>

    <!-- Main Content -->
    <div class="main-content fade-in">
        <div class="top-bar">
            <h1>Dashboard Overview</h1>
            <div class="admin-profile"><i class="fa-solid fa-user-shield"></i> enjoygfd42@gmail.com</div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(91, 65, 255, 0.1); color: var(--purple);"><i class="fa-solid fa-users"></i></div>
                <div class="stat-info"><h3 id="total-users">0</h3><p>Total Users</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(14, 203, 129, 0.1); color: var(--green);"><i class="fa-solid fa-wallet"></i></div>
                <div class="stat-info"><h3 id="active-users">0</h3><p>Active Users</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(246, 70, 93, 0.1); color: var(--red);"><i class="fa-solid fa-user-slash"></i></div>
                <div class="stat-info"><h3 id="restricted-users">0</h3><p>Restricted Users</p></div>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- Left Column: Users Table -->
            <div class="card">
                <div class="card-header">
                    <h3><i class="fa-solid fa-users"></i> User Management</h3>
                    <button class="btn btn-primary" style="width: auto; padding: 8px 15px; font-size: 12px;" onclick="loadUsers()"><i class="fa-solid fa-rotate"></i> Refresh</button>
                </div>
                <div class="table-scroll">
                    <table id="users-table">
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Wallet ID</th>
                                <th>Balances</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Right Column: Tools -->
            <div>
                <!-- Manage Balances -->
                <div class="card">
                    <h3><i class="fa-solid fa-money-bill-transfer"></i> Adjust Balance</h3>
                    <div class="form-group">
                        <label>Select User Wallet</label>
                        <select id="user-wallet-select"></select>
                    </div>
                    <div class="form-group">
                        <label>Select Coin</label>
                        <select id="coin-select-add">
                            <option value="BTC">BTC</option><option value="ETH">ETH</option><option value="SOL">SOL</option>
                            <option value="USDT">USDT</option><option value="XRP">XRP</option><option value="BNB">BNB</option>
                            <option value="ADA">ADA</option><option value="DOGE">DOGE</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" id="amount-input" placeholder="e.g. 100" step="any">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-success" style="flex: 1;" onclick="modifyBalance('add')"><i class="fa-solid fa-plus"></i> Add</button>
                        <button class="btn btn-danger" style="flex: 1;" onclick="modifyBalance('remove')"><i class="fa-solid fa-minus"></i> Remove</button>
                    </div>
                </div>

                <!-- Withdrawal Codes -->
                <div class="card">
                    <h3><i class="fa-solid fa-ticket"></i> Create Code</h3>
                    <div class="form-group">
                        <label>Restrict to Coin</label>
                        <select id="code-coin">
                            <option value="ALL">Any Coin</option>
                            <option value="BTC">BTC</option><option value="ETH">ETH</option><option value="SOL">SOL</option><option value="USDT">USDT</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Custom Code</label>
                        <input type="text" id="custom-code-input" placeholder="e.g. VIP100" style="text-transform: uppercase;">
                    </div>
                    <button class="btn btn-primary" onclick="generateCode()">Generate Code</button>
                    <div id="generated-code-display" class="code-display">XXXXXX</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAMucqvSoBlUo5jn5Pu4ClQIGRlInu55mQ", authDomain: "project-app-259f2.firebaseapp.com",
      projectId: "project-app-259f2", storageBucket: "project-app-259f2.firebasestorage.app",
      messagingSenderId: "389607996830", appId: "1:389607996830:web:a9e456c60e4608f1a9ea8f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const ADMIN_EMAIL = 'enjoygfd42@gmail.com';

    window.showToast = function(message, type = 'success') {
        const toast = document.getElementById('toast');
        const msg = document.getElementById('toast-msg');
        const icon = toast.querySelector('i');
        msg.innerText = message;
        toast.className = `toast show ${type}`;
        icon.className = type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-exclamation';
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    window.loginAdmin = async function() {
        const email = document.getElementById('admin-email').value;
        const password = document.getElementById('admin-password').value;
        if(email !== ADMIN_EMAIL) return showToast("Unauthorized Access.", "error");
        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) { showToast("Login Failed: " + error.message, "error"); }
    }

    window.logout = function() { signOut(auth); }

    onAuthStateChanged(auth, (user) => {
        if (user && user.email === ADMIN_EMAIL) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('admin-section').style.display = 'block';
            loadUsers();
        } else {
            document.getElementById('login-section').style.display = 'flex';
            document.getElementById('admin-section').style.display = 'none';
        }
    });

    window.loadUsers = async function() {
        const tableBody = document.querySelector('#users-table tbody');
        const walletSelect = document.getElementById('user-wallet-select');
        tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</td></tr>';
        walletSelect.innerHTML = '';

        try {
            const usersSnapshot = await getDocs(collection(db, "users"));
            const usersMap = {};
            let activeCount = 0;
            let restrictedCount = 0;

            usersSnapshot.forEach(doc => { 
                const data = doc.data();
                usersMap[doc.id] = { email: data.email || 'Unknown', status: data.status || 'active' }; 
                if (data.status === 'active' || !data.status) activeCount++;
                if (data.status === 'frozen' || data.status === 'blocked') restrictedCount++;
            });

            document.getElementById('total-users').innerText = usersSnapshot.size;
            document.getElementById('active-users').innerText = activeCount;
            document.getElementById('restricted-users').innerText = restrictedCount;

            const walletsSnapshot = await getDocs(collection(db, "wallets"));
            tableBody.innerHTML = '';

            walletsSnapshot.forEach((doc) => {
                const data = doc.data();
                const ownerUid = data.ownerUid;
                const userInfo = usersMap[ownerUid] || { email: 'Unknown', status: 'active' };
                const balances = data.balances || {};
                
                let balancesHtml = '';
                for (const [coin, amount] of Object.entries(balances)) {
                    if (amount !== 0) {
                        const color = amount < 0 ? 'var(--red)' : 'var(--green)';
                        balancesHtml += `<span style="color:${color}; font-size:12px; display:block;">${amount.toFixed(4)} ${coin}</span>`;
                    }
                }
                if (balancesHtml === '') balancesHtml = '<span style="color:var(--muted);">Empty</span>';

                const status = userInfo.status || 'active';
                const badgeClass = status === 'active' ? 'active' : (status === 'frozen' ? 'frozen' : 'blocked');
                
                tableBody.innerHTML += `
                    <tr>
                        <td style="font-weight:600;">${userInfo.email}</td>
                        <td style="font-family:monospace; color:var(--muted);">${doc.id}</td>
                        <td>${balancesHtml}</td>
                        <td><span class="badge ${badgeClass}">${status}</span></td>
                        <td>
                            <select class="action-select" onchange="updateUserStatus('${ownerUid}', this.value)">
                                <option value="active" ${status === 'active' ? 'selected' : ''}>Active</option>
                                <option value="frozen" ${status === 'frozen' ? 'selected' : ''}>Freeze</option>
                                <option value="blocked" ${status === 'blocked' ? 'selected' : ''}>Block</option>
                            </select>
                        </td>
                    </tr>
                `;

                const option = document.createElement('option');
                option.value = doc.id;
                option.innerText = `${userInfo.email} - ${doc.id}`;
                walletSelect.appendChild(option);
            });
        } catch (error) {
            tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--red);">Error: ${error.message}</td></tr>`;
        }
    }

    window.updateUserStatus = async function(uid, newStatus) {
        try {
            await updateDoc(doc(db, "users", uid), { status: newStatus });
            showToast(`User status updated to ${newStatus.toUpperCase()}.`, newStatus === 'active' ? 'success' : 'error');
            loadUsers();
        } catch (error) { showToast("Error: " + error.message, "error"); }
    }

    window.modifyBalance = async function(action) {
        const walletId = document.getElementById('user-wallet-select').value;
        const coin = document.getElementById('coin-select-add').value;
        const amount = parseFloat(document.getElementById('amount-input').value);
        
        if (!walletId) return showToast("Select a user wallet.", "error");
        if (isNaN(amount) || amount <= 0) return showToast("Enter a valid amount.", "error");

        try {
            const walletRef = doc(db, "wallets", walletId);
            const walletSnap = await getDoc(walletRef);
            const balances = walletSnap.data().balances || {};
            const currentBalance = parseFloat(balances[coin]) || 0;

            if (action === 'remove' && amount > currentBalance) {
                return showToast(`User only has ${currentBalance} ${coin}.`, "error");
            }

            const multiplier = action === 'add' ? 1 : -1;
            await updateDoc(walletRef, { [`balances.${coin}`]: increment(amount * multiplier) });
            
            showToast(`Successfully ${action === 'add' ? 'added' : 'removed'} ${amount} ${coin}.`, 'success');
            document.getElementById('amount-input').value = '';
            loadUsers(); 
        } catch (error) { showToast("Error: " + error.message, "error"); }
    }

    window.generateCode = async function() {
        const coin = document.getElementById('code-coin').value;
        let customCode = document.getElementById('custom-code-input').value.trim().toUpperCase();

        if (!customCode) return showToast("Enter a custom code.", "error");

        try {
            const codeRef = doc(db, "withdrawal_codes", customCode);
            const codeSnap = await getDoc(codeRef);
            
            if (codeSnap.exists()) return showToast("Code already exists!", "error");

            await setDoc(codeRef, {
                coin: coin, status: 'active', createdAt: new Date(), createdBy: auth.currentUser.uid
            });

            const display = document.getElementById('generated-code-display');
            display.innerText = `Code: ${customCode}`;
            display.classList.add('show');
            document.getElementById('custom-code-input').value = '';
            showToast(`Code created successfully!`, 'success');
        } catch (error) { showToast("Error: " + error.message, "error"); }
    }
</script>
</body>
</html>
