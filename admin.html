<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Control Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg: #0b0e11; 
            --card: #181a20; 
            --text: #ffffff; 
            --muted: #848e9c; 
            --green: #0ecb81; 
            --purple: #5b41ff; 
            --red: #f6465d; 
            --border: #2b3139;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* --- ANIMATIONS --- */
        .loader-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        .loader { width: 40px; height: 40px; border: 4px solid #2b3139; border-top: 4px solid var(--purple); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; opacity: 0; transform: translateY(20px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        
        /* Custom Toast */
        .toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--card); color: white; padding: 15px 30px; border-radius: 30px; font-weight: bold; font-size: 14px; z-index: 10000; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55); box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; border: 1px solid var(--border);}
        .toast.show { top: 20px; }
        .toast.error { border-color: rgba(246, 70, 93, 0.5); color: var(--red); }
        .toast.success { border-color: rgba(14, 203, 129, 0.5); color: var(--green); }

        /* --- HEADER --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .header h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px;}
        .logout-btn { background: rgba(246, 70, 93, 0.1); color: var(--red); border: 1px solid rgba(246, 70, 93, 0.3); padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .logout-btn:hover { background: var(--red); color: white; }
        .logout-btn:active { transform: scale(0.95); }

        /* --- CARDS --- */
        .card { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; transition: transform 0.3s, box-shadow 0.3s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .card h3 { font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
        input, select { width: 100%; padding: 15px; background: var(--bg); border: 1px solid var(--border); color: white; border-radius: 8px; font-size: 16px; outline: none; transition: 0.2s; }
        input:focus, select:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(91, 65, 255, 0.1); }
        
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); display: flex; justify-content: center; align-items: center; gap: 8px;}
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn:active { transform: scale(0.95); box-shadow: none;}
        
        .btn-primary { background: var(--purple); color: white; }
        .btn-success { background: var(--green); color: black; }
        .btn-danger { background: var(--red); color: white; }
        
        /* --- TABLE --- */
        .table-container { background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
        .table-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .table-scroll { max-height: 500px; overflow-y: auto; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
        th, td { padding: 15px 20px; border-bottom: 1px solid var(--border); font-size: 14px; transition: background 0.2s; }
        th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; background: rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 1;}
        tr:hover td { background: rgba(255,255,255,0.02); }
        
        .balance-badge { background: rgba(14, 203, 129, 0.1); color: var(--green); padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-right: 5px; display: inline-block; margin-bottom: 4px;}
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status-active { background: rgba(14, 203, 129, 0.1); color: var(--green); }
        .status-frozen { background: rgba(246, 70, 93, 0.1); color: var(--red); }
        
        .code-display { background: rgba(91, 65, 255, 0.1); border: 1px dashed var(--purple); padding: 15px; border-radius: 8px; text-align: center; font-family: monospace; font-size: 24px; font-weight: bold; color: var(--green); margin-top: 15px; display: none; }
        .code-display.show { display: block; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- LOGIN --- */
        .login-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: var(--card); padding: 40px; border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; animation: fadeInUp 0.6s ease-out; }
        .login-box h2 { margin-bottom: 25px; }
        .login-box input { margin-bottom: 15px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- Custom Toast -->
<div id="toast" class="toast"><i class="fa-solid fa-circle-check"></i> <span id="toast-msg">Notification</span></div>

<!-- Loader -->
<div class="loader-overlay" id="loader"><div class="loader"></div></div>

<div class="container">
    <!-- LOGIN SECTION -->
    <div id="login-section" class="login-container">
        <div class="login-box">
            <h2><i class="fa-solid fa-shield-halved" style="color: var(--purple);"></i> Admin Access</h2>
            <input type="email" id="admin-email" placeholder="Admin Email">
            <input type="password" id="admin-password" placeholder="Password">
            <button class="btn btn-primary" style="width: 100%;" onclick="loginAdmin()">Secure Login</button>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="admin-section" class="hidden">
        <div class="header fade-in-up">
            <h1><i class="fa-solid fa-crown" style="color: #f3ba2f;"></i> Control Center</h1>
            <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>

        <div class="grid" style="display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px;">
            <!-- Manage Balances -->
            <div class="card fade-in-up stagger-1">
                <h3><i class="fa-solid fa-wallet" style="color: var(--purple);"></i> Manage User Balances</h3>
                <div class="form-group">
                    <label>Select User Wallet</label>
                    <select id="user-wallet-select"></select>
                </div>
                <div class="form-group">
                    <label>Coin</label>
                    <select id="coin-select-add">
                        <option value="BTC">BTC</option><option value="ETH">ETH</option><option value="SOL">SOL</option>
                        <option value="USDT">USDT</option><option value="XRP">XRP</option><option value="BNB">BNB</option>
                        <option value="ADA">ADA</option><option value="DOGE">DOGE</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount (Numbers only)</label>
                    <input type="number" id="amount-input" placeholder="e.g. 100 or 0.5" step="any">
                </div>
                <div class="btn-row">
                    <button class="btn btn-success" onclick="modifyBalance('add')"><i class="fa-solid fa-plus"></i> Add Coins</button>
                    <button class="btn btn-danger" onclick="modifyBalance('remove')"><i class="fa-solid fa-minus"></i> Remove Coins</button>
                </div>
            </div>

            <!-- Custom Withdrawal Codes -->
            <div class="card fade-in-up stagger-2">
                <h3><i class="fa-solid fa-key" style="color: #f3ba2f;"></i> Create Withdrawal Code</h3>
                <p style="font-size: 13px; color: var(--green); margin-bottom: 15px;"><i class="fa-solid fa-circle-info"></i> Note: Every code can only be used ONCE. Once a user withdraws, the code becomes invalid.</p>
                
                <div class="form-group">
                    <label>Coin to Restrict Code To</label>
                    <select id="code-coin">
                        <option value="ALL">Allow Any Coin</option>
                        <option value="BTC">BTC</option>
                        <option value="ETH">ETH</option>
                        <option value="SOL">SOL</option>
                        <option value="USDT">USDT</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Your Custom Code (e.g. VIP100, BONUS)</label>
                    <input type="text" id="custom-code-input" placeholder="Type your custom code here" style="text-transform: uppercase;" maxlength="15">
                </div>
                <button class="btn btn-primary" style="width: 100%;" onclick="generateCode()"><i class="fa-solid fa-ticket"></i> Create Single-Use Code</button>
                <div id="generated-code-display" class="code-display">XXXXXX</div>
            </div>
        </div>

        <!-- Users Table -->
        <div class="table-container fade-in-up stagger-3">
            <div class="table-header">
                <h3><i class="fa-solid fa-users" style="color: var(--muted);"></i> Registered Users</h3>
                <button class="btn btn-primary" style="flex: none; padding: 10px 15px;" onclick="loadUsers()"><i class="fa-solid fa-rotate"></i> Refresh</button>
            </div>
            <div class="table-scroll">
                <table id="users-table">
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Wallet ID</th>
                            <th>Balances</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAMucqvSoBlUo5jn5Pu4ClQIGRlInu55mQ", authDomain: "project-app-259f2.firebaseapp.com",
      projectId: "project-app-259f2", storageBucket: "project-app-259f2.firebasestorage.app",
      messagingSenderId: "389607996830", appId: "1:389607996830:web:a9e456c60e4608f1a9ea8f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const ADMIN_EMAIL = 'enjoygfd42@gmail.com';

    // Hide Loader on load
    window.addEventListener('load', () => {
        const loader = document.getElementById('loader');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 500);
    });

    // Custom Animated Toast
    window.showToast = function(message, type = 'success') {
        const toast = document.getElementById('toast');
        const msg = document.getElementById('toast-msg');
        const icon = toast.querySelector('i');
        
        msg.innerText = message;
        toast.className = `toast show ${type}`;
        
        if (type === 'success') {
            icon.className = 'fa-solid fa-circle-check';
        } else {
            icon.className = 'fa-solid fa-circle-exclamation';
        }

        setTimeout(() => {
            toast.classList.remove('show');
        }, 3500);
    }

    window.loginAdmin = async function() {
        const email = document.getElementById('admin-email').value;
        const password = document.getElementById('admin-password').value;
        if(email !== ADMIN_EMAIL) return showToast("Unauthorized Access.", "error");
        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) { 
            showToast("Login Failed: " + error.message, "error"); 
        }
    }

    window.logout = function() { signOut(auth); }

    onAuthStateChanged(auth, (user) => {
        if (user && user.email === ADMIN_EMAIL) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('admin-section').classList.remove('hidden');
            loadUsers();
        } else {
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('admin-section').classList.add('hidden');
        }
    });

    window.loadUsers = async function() {
        const tableBody = document.querySelector('#users-table tbody');
        const walletSelect = document.getElementById('user-wallet-select');
        tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</td></tr>';
        walletSelect.innerHTML = '';

        try {
            const usersSnapshot = await getDocs(collection(db, "users"));
            const usersMap = {};
            usersSnapshot.forEach(doc => { 
                usersMap[doc.id] = { email: doc.data().email || 'Unknown User', status: doc.data().status || 'active' }; 
            });

            const walletsSnapshot = await getDocs(collection(db, "wallets"));
            tableBody.innerHTML = '';

            walletsSnapshot.forEach((doc) => {
                const data = doc.data();
                const ownerUid = data.ownerUid;
                const userInfo = usersMap[ownerUid] || { email: 'Unknown', status: 'active' };
                const balances = data.balances || {};
                
                let balancesHtml = '';
                for (const [coin, amount] of Object.entries(balances)) {
                    if (amount !== 0) {
                        const color = amount < 0 ? 'var(--red)' : 'var(--green)';
                        balancesHtml += `<span class="balance-badge" style="color:${color}; background:rgba(${amount < 0 ? '246,70,93' : '14,203,129'},0.1);">${amount} ${coin}</span>`;
                    }
                }
                if (balancesHtml === '') balancesHtml = '<span style="color:var(--muted);">Empty</span>';

                const isFrozen = userInfo.status === 'frozen';
                const statusBadge = isFrozen ? '<span class="status-badge status-frozen">Frozen</span>' : '<span class="status-badge status-active">Active</span>';
                const actionBtn = isFrozen 
                    ? `<button class="btn btn-success" style="padding: 8px; font-size:12px;" onclick="toggleFreeze('${ownerUid}', 'frozen')">Unfreeze</button>`
                    : `<button class="btn btn-danger" style="padding: 8px; font-size:12px;" onclick="toggleFreeze('${ownerUid}', 'active')">Freeze</button>`;

                tableBody.innerHTML += `
                    <tr>
                        <td>${userInfo.email}</td>
                        <td>${doc.id}</td>
                        <td>${balancesHtml}</td>
                        <td>${statusBadge}</td>
                        <td>${actionBtn}</td>
                    </tr>
                `;

                const option = document.createElement('option');
                option.value = doc.id;
                option.innerText = `${userInfo.email} - ${doc.id}`;
                walletSelect.appendChild(option);
            });
        } catch (error) {
            tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--red);">Error: ${error.message}</td></tr>`;
        }
    }

    window.toggleFreeze = async function(uid, currentStatus) {
        const newStatus = currentStatus === 'frozen' ? 'active' : 'frozen';
        try {
            await updateDoc(doc(db, "users", uid), { status: newStatus });
            showToast(`User account has been ${newStatus === 'frozen' ? 'FROZEN' : 'ACTIVATED'}.`, newStatus === 'active' ? 'success' : 'error');
            loadUsers(); 
        } catch (error) { showToast("Error: " + error.message, "error"); }
    }

    window.modifyBalance = async function(action) {
        const walletId = document.getElementById('user-wallet-select').value;
        const coin = document.getElementById('coin-select-add').value;
        const amount = parseFloat(document.getElementById('amount-input').value);
        
        if (!walletId) return showToast("Please select a user wallet first.", "error");
        if (isNaN(amount) || amount <= 0) return showToast("Please enter a valid amount greater than 0.", "error");

        try {
            const walletRef = doc(db, "wallets", walletId);
            const walletSnap = await getDoc(walletRef);
            const balances = walletSnap.data().balances || {};
            const currentBalance = parseFloat(balances[coin]) || 0;

            if (action === 'remove' && amount > currentBalance) {
                return showToast(`Error: User only has ${currentBalance} ${coin}.`, "error");
            }

            const multiplier = action === 'add' ? 1 : -1;
            await updateDoc(walletRef, { [`balances.${coin}`]: increment(amount * multiplier) });
            
            showToast(`Successfully ${action === 'add' ? 'added' : 'removed'} ${amount} ${coin}.`, 'success');
            document.getElementById('amount-input').value = '';
            loadUsers(); 
        } catch (error) { showToast("Error: " + error.message, "error"); }
    }

    window.generateCode = async function() {
        const coin = document.getElementById('code-coin').value;
        let customCode = document.getElementById('custom-code-input').value.trim().toUpperCase();

        if (!customCode) return showToast("Please type a custom code.", "error");

        try {
            const codeRef = doc(db, "withdrawal_codes", customCode);
            const codeSnap = await getDoc(codeRef);
            
            if (codeSnap.exists()) {
                return showToast("This code already exists! Please choose a different one.", "error");
            }

            await setDoc(codeRef, {
                coin: coin, status: 'active', createdAt: new Date(), createdBy: auth.currentUser.uid
            });

            const display = document.getElementById('generated-code-display');
            display.innerText = `Code Created: ${customCode}`;
            display.classList.add('show');
            document.getElementById('custom-code-input').value = '';
            
            showToast(`Code "${customCode}" created successfully!`, 'success');
            
        } catch (error) { showToast("Error: " + error.message, "error"); }
    }
</script>
</body>
</html>
